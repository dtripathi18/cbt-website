<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About the Event - CBT Course Series</title>
<meta name="description" content="About the CBT Course Series - an annual training event from the Centre of Excellence for Biopharmaceutical Technology, IIT Delhi." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png" />
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css?v=2026-11-05" />
</head>
<body>

<header class="cs-header">
  <div class="cs-container cs-header-inner">
    <a class="cs-brand" href="index.html">
      <img src="assets/images/cbt-logo.png" alt="CBT logo" />
    </a>
    <button class="cs-nav-toggle" id="csNavToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="cs-nav" id="csNav">
      <a class="cs-nav-link" href="register.html">Register Now</a>
      <a class="cs-nav-link cs-nav-link--muted" id="mainSiteNavLink" href="#">← CBT main site</a>
    </nav>
  </div>
</header>

<main class="cs-main">
  <div class="cs-container">

    <section class="cs-about-hero">
      <span class="cs-about-eyebrow" id="aboutEyebrow"></span>
      <h1 id="aboutHeading"></h1>
      <p class="cs-about-meta" id="aboutMeta"></p>
      <p class="cs-about-intro" id="aboutIntro"></p>
      <ul class="cs-about-highlights" id="aboutHighlights"></ul>
      <div class="cs-about-cta">
        <a class="cs-btn-primary" href="register.html">Register Now</a>
        <a class="cs-intro-link" id="aboutBrochureLink" href="#" target="_blank"></a>
      </div>
    </section>

    <div class="cs-about-banner" id="aboutBanner"></div>

    <section class="cs-about-block">
      <h2>Who Should Attend</h2>
      <div class="cs-about-audience" id="audienceGrid"></div>
    </section>

    <section class="cs-about-block cs-tabs-block">
      <div class="cs-tabs" role="tablist" aria-label="Course details" id="aboutTabs">
        <button class="cs-tab" type="button" role="tab" id="tab-curriculum" data-tab="curriculum" aria-controls="panel-curriculum" aria-selected="true">Course Curriculum</button>
        <button class="cs-tab" type="button" role="tab" id="tab-fees" data-tab="fees" aria-controls="panel-fees" aria-selected="false" tabindex="-1">Fee Structure</button>
        <button class="cs-tab" type="button" role="tab" id="tab-speakers" data-tab="speakers" aria-controls="panel-speakers" aria-selected="false" tabindex="-1">Speakers</button>
        <button class="cs-tab" type="button" role="tab" id="tab-sponsors" data-tab="sponsors" aria-controls="panel-sponsors" aria-selected="false" tabindex="-1">Sponsors</button>
      </div>

      <div class="cs-tab-panel" role="tabpanel" id="panel-curriculum" aria-labelledby="tab-curriculum">
        <div id="curriculumDays"></div>
      </div>

      <div class="cs-tab-panel" role="tabpanel" id="panel-fees" aria-labelledby="tab-fees" hidden>
        <div class="cs-tab-card">
          <div class="cs-fee-table-wrap">
            <table class="cs-fee-table" id="aboutFeeTable"></table>
          </div>
          <p class="cs-table-note" id="aboutFeeNote"></p>
          <p class="cs-early-bird" id="aboutEarlyBird" hidden></p>
          <p class="cs-fee-warning" id="aboutFeeWarning"></p>
        </div>

        <div class="cs-tab-card">
          <h3 class="cs-tab-subhead">Hostel Accommodation</h3>
          <div class="cs-fee-table-wrap">
            <table class="cs-fee-table" id="aboutAccommodationTable"></table>
          </div>
          <p class="cs-table-note" id="aboutAccommodationNote"></p>
        </div>
      </div>

      <div class="cs-tab-panel" role="tabpanel" id="panel-speakers" aria-labelledby="tab-speakers" hidden>
        <p class="cs-hint" id="speakersHint"></p>
        <div class="cs-speakers" id="speakerList"></div>
      </div>

      <div class="cs-tab-panel" role="tabpanel" id="panel-sponsors" aria-labelledby="tab-sponsors" hidden>
        <div class="cs-sponsors" id="sponsorGrid"></div>
      </div>
    </section>

    <section class="cs-about-cta-band">
      <h2>Ready to join us?</h2>
      <p>Registration is open for industry professionals and academic researchers.</p>
      <a class="cs-btn-primary" href="register.html">Register Now</a>
    </section>

  </div>
</main>

<script src="js/programme-data.js?v=20261023174141"></script>
<script src="js/config.js?v=2026-09-29"></script>
<script src="js/shared.js?v=2026-09-23"></script>
<script src="js/about.js?v=2026-11-05"></script>
</body>
</html>
